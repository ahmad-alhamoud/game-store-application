spring:
  application:
    name: game-store-api

  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://localhost:5432/game_store
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080